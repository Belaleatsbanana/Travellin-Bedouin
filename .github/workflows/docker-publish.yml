name: Build & Publish to GHCR

on:
  push:
    branches:
      - main          # publish on every merge to main
    tags:
      - "v*.*.*"      # also publish on version tags, e.g. v1.0.0
  pull_request:
    branches:
      - main          # build (but don't push) on PRs to main for validation

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/travellin-bedouin-frontend

jobs:
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest

    # Required permissions for pushing to GHCR
    permissions:
      contents: read
      packages: write
      id-token: write   # needed for attestation (optional but good practice)

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (enables multi-platform builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry
      #    On pull_request events, GITHUB_TOKEN only has read access,
      #    so we skip login and the push step is automatically skipped.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata for tags and labels
      #    Produces tags like:
      #      ghcr.io/belaleatsbanana/travellin-bedouin-frontend:latest
      #      ghcr.io/belaleatsbanana/travellin-bedouin-frontend:main
      #      ghcr.io/belaleatsbanana/travellin-bedouin-frontend:sha-a1b2c3d
      #      ghcr.io/belaleatsbanana/travellin-bedouin-frontend:v1.0.0  (on tag push)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 5. Build and push the Docker image
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass public env vars as build args.
          # NEXT_PUBLIC_* vars are baked into the bundle at build time.
          # Set these as Repository Secrets in GitHub Settings > Secrets.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_MOCK_API=false
            NEXT_PUBLIC_USE_SSE=false
            NEXT_PUBLIC_POLL_INTERVAL_MS=2000
          # Layer caching — dramatically speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both amd64 (servers) and arm64 (Apple Silicon / Raspberry Pi)
          platforms: linux/amd64,linux/arm64
