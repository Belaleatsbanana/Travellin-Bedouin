services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = relative URLs (/api/...) — browser never needs the backend host
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_USE_SSE: "false"
        NEXT_PUBLIC_POLL_INTERVAL_MS: "2000"
    image: ghcr.io/belaleatsbanana/travellin-bedouin-frontend:local
    container_name: travellin-frontend
    init: true
    stop_grace_period: 5s
    stop_signal: SIGTERM
    security_opt:
      - apparmor:unconfined
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Internal container URL — used by Next.js server-side rewrites, never exposed to browser
      BACKEND_URL: http://travellin-backend:8000
    depends_on:
      backend: 
        condition: service_healthy
    networks:
      - travellin-net
    restart: unless-stopped

  # ── Backend (FastAPI + Groq) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/belaleatsbanana/travellin-bedouin-backend:local
    container_name: travellin-backend
    init: true
    stop_grace_period: 5s
    stop_signal: SIGTERM
    security_opt:
      - apparmor:unconfined
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      GROQ_MODEL: llama-3.3-70b-versatile
      # Frontend container is the only caller — its requests arrive from the Next.js server
      CORS_ORIGINS: http://travellin-frontend:3000
      SESSION_TTL_SECONDS: "86400"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travellin-net
    restart: unless-stopped

networks:
  travellin-net:
    driver: bridge
