services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the JS bundle at build time.
        # When running with the backend profile, the frontend will call it at localhost:8000.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_USE_SSE: "false"
        NEXT_PUBLIC_POLL_INTERVAL_MS: "2000"
    image: ghcr.io/belaleatsbanana/travellin-bedouin-frontend:local
    container_name: travellin-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    networks:
      - travellin-net
    restart: unless-stopped

  # ── Backend (FastAPI + Groq) ──────────────────────────────────────────────
  # The backend is opt-in via the "backend" profile.
  # It will only start when you explicitly request it:
  #   docker compose --profile backend up
  #
  # The backend/ folder and its Dockerfile must exist before this works.
  backend:
    profiles:
      - backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/belaleatsbanana/travellin-bedouin-backend:local
    container_name: travellin-backend
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama3-70b-8192
      CORS_ORIGINS: http://localhost:3000
      SESSION_TTL_SECONDS: "86400"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travellin-net
    restart: unless-stopped

networks:
  travellin-net:
    driver: bridge
