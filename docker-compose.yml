services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle — browser calls backend at localhost:8000
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_USE_SSE: "false"
        NEXT_PUBLIC_POLL_INTERVAL_MS: "2000"
    image: ghcr.io/belaleatsbanana/travellin-bedouin-frontend:local
    container_name: travellin-frontend
    init: true
    stop_grace_period: 5s
    stop_signal: SIGTERM
    security_opt:
      - apparmor:unconfined
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travellin-net
    restart: unless-stopped

  # ── Backend (FastAPI + Groq) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/belaleatsbanana/travellin-bedouin-backend:local
    container_name: travellin-backend
    init: true
    stop_grace_period: 5s
    stop_signal: SIGTERM
    security_opt:
      - apparmor:unconfined
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      GROQ_MODEL: llama-3.3-70b-versatile
      CORS_ORIGINS: http://localhost:3000
      SESSION_TTL_SECONDS: "86400"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travellin-net
    restart: unless-stopped

networks:
  travellin-net:
    driver: bridge
